name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Unzip project
      run: unzip Voice_Social_App_1.0.0.zip

    - name: Make gradlew executable
      run: chmod +x kayan_voice/android/gradlew

    - name: Build APK
      run: cd kayan_voice/android && ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: app-debug
        path: kayan_voice/android/app/build/outputs/apk/debug/app-debug.apk
